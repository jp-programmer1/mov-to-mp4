name: Build installers

# Compila los instaladores en runners nativos:
#   - Windows  -> .exe (NSIS)
#   - macOS    -> .dmg
# Se ejecuta manualmente (workflow_dispatch) o al publicar un tag vX.Y.Z.
# Con un tag, además adjunta los instaladores a una Release de GitHub.
# Los nombres son fijos (sin versión) para que este link siempre baje la última:
#   https://github.com/jp-programmer1/mov-to-mp4/releases/latest/download/MOV-to-MP4-mac-arm64.dmg
#   https://github.com/jp-programmer1/mov-to-mp4/releases/latest/download/MOV-to-MP4-Setup-x64.exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.os }} installer
        # electron-builder no publica: lo hace el paso "Attach to GitHub Release".
        run: pnpm run ${{ matrix.script }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: warn

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
